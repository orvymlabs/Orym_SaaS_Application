name: Deploy to Hostinger

on:
  push:
    branches: [master]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Create .env file
        run: |
          echo "NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}" >> .env.production
          echo "NEXT_PUBLIC_WS_URL=${{ secrets.NEXT_PUBLIC_WS_URL }}" >> .env.production
          echo "NEXT_PUBLIC_WEBHOOK_URL=${{ secrets.NEXT_PUBLIC_WEBHOOK_URL }}" >> .env.production
          echo "NEXT_PUBLIC_APP_NAME=${{ secrets.NEXT_PUBLIC_APP_NAME }}" >> .env.production
          echo "NEXT_PUBLIC_ENV=${{ secrets.NEXT_PUBLIC_ENV }}" >> .env.production
          echo "NEXT_PUBLIC_ENABLE_CHAT=${{ secrets.NEXT_PUBLIC_ENABLE_CHAT }}" >> .env.production
          echo "NEXT_PUBLIC_ENABLE_LEADS=${{ secrets.NEXT_PUBLIC_ENABLE_LEADS }}" >> .env.production
          echo "NEXT_PUBLIC_ENABLE_ANALYTICS=${{ secrets.NEXT_PUBLIC_ENABLE_ANALYTICS }}" >> .env.production
          echo "NEXT_PUBLIC_STARTER_MESSAGES_LIMIT=${{ secrets.NEXT_PUBLIC_STARTER_MESSAGES_LIMIT }}" >> .env.production
          echo "NEXT_PUBLIC_STARTER_AI_LIMIT=${{ secrets.NEXT_PUBLIC_STARTER_AI_LIMIT }}" >> .env.production
          echo "NEXT_PUBLIC_GROWTH_MESSAGES_LIMIT=${{ secrets.NEXT_PUBLIC_GROWTH_MESSAGES_LIMIT }}" >> .env.production
          echo "NEXT_PUBLIC_GROWTH_AI_LIMIT=${{ secrets.NEXT_PUBLIC_GROWTH_AI_LIMIT }}" >> .env.production
        working-directory: ./frontend

      - name: Install & Build
        run: |
          npm install
          npm run build
        working-directory: ./frontend

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./frontend/out/
          server-dir: /public_html/apps/
          port: 21
          protocol: ftp
          timeout: 60000
          dangerous-clean-slate: true
          exclude: |
            **/.git*
            **/.git*/**