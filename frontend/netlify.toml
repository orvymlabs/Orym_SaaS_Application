[build]
  command = "npm run build"
  publish = "out"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/api/*"
  to = "https://orym-saas-application.onrender.com/api/:splat"
  status = 200
  force = true
  # Local development: use http://localhost:8001/api/:splat
